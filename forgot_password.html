<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password - Fraud Detection System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .forgot-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .forgot-container h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 28px;
        }

        .forgot-container p {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border-radius: 5px;
            text-decoration: none;
            transition: background 0.3s;
        }

        .back-link:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>

<div class="forgot-container">
    <h2>🔐 Forgot Password</h2>
    <p>
        For security reasons, password reset is not available in this demo.
        If you need access, please create a new account or contact the administrator.
    </p>
    <a href="/login" class="back-link">Back to Login</a>
</div>

</body>
</html>
